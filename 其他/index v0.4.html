<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影觅 · 让好作品不再隐秘</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           DESIGN TOKENS — DARK THEME (default)
           ============================================================ */
        :root {
            --bg-primary: #0b0f1a;
            --bg-secondary: #111827;
            --bg-tertiary: #1a2332;
            --bg-card: #141e2e;
            --bg-card-hover: #1a2840;
            --bg-modal: #0d1320;
            --bg-input: #0f1724;
            --bg-chip: #1a2740;
            --bg-chip-active: #1e3a5f;
            --bg-skeleton: #1a2840;
            --bg-skeleton-shine: #223050;
            --bg-header: rgba(17,24,39,0.88);
            --bg-toolbar: #0f1624;
            --bg-toolbar-btn: #1a2740;
            --bg-toolbar-btn-text: #94a3b8;
            --bg-toolbar-btn-active: #3b82f6;
            --bg-toolbar-btn-active-text: #fff;

            --border-subtle: #1e2d40;
            --border-medium: #2a3a55;
            --border-accent: #2d4a6e;

            --text-primary: #e8edf5;
            --text-secondary: #94a3b8;
            --text-muted: #5f7188;
            --text-slogan: #4f6180;

            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59,130,246,0.25);
            --accent-gradient: linear-gradient(135deg, #60a5fa, #3b82f6);

            --rating-gold: #f59e0b;
            --rating-bg: rgba(245,158,11,0.15);

            --error: #ef4444;
            --error-bg: rgba(239,68,68,0.1);
            --success: #22c55e;
            --success-bg: rgba(34,197,94,0.1);

            --shadow-card: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-modal: 0 8px 40px rgba(0,0,0,0.6);

            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;

            --transition-fast: 0.15s ease;
            --transition-smooth: 0.25s cubic-bezier(0.4,0,0.2,1);

            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;

            --header-h: 52px;
            --toolbar-h: 48px;

            --filter-width: 350px;/*筛选面板宽度*/
        }

        /* ============================================================
           LIGHT THEME
           ============================================================ */
        [data-theme="light"] {
            --bg-primary: #f2f4f8;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8ecf1;
            --bg-card: #ffffff;
            --bg-card-hover: #eef2ff;
            --bg-modal: #ffffff;
            --bg-input: #f4f5f8;
            --bg-chip: #e8ecf1;
            --bg-chip-active: #d6e2ff;
            --bg-skeleton: #e8ecf1;
            --bg-skeleton-shine: #dce0e5;
            --bg-header: rgba(255,255,255,0.92);
            --bg-toolbar: #eef0f4;
            --bg-toolbar-btn: #e2e5ea;
            --bg-toolbar-btn-text: #5a6475;
            --bg-toolbar-btn-active: #3b82f6;
            --bg-toolbar-btn-active-text: #fff;

            --border-subtle: #dee2e8;
            --border-medium: #c8ced8;
            --border-accent: #9ca8b8;

            --text-primary: #1a1d24;
            --text-secondary: #5a6475;
            --text-muted: #8a94a6;
            --text-slogan: #9aa5b5;

            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59,130,246,0.18);

            --rating-gold: #d97706;
            --rating-bg: rgba(217,119,6,0.1);

            --error: #dc2626;
            --error-bg: rgba(220,38,38,0.08);
            --success: #16a34a;
            --success-bg: rgba(22,163,74,0.08);

            --shadow-card: 0 2px 8px rgba(0,0,0,0.07);
            --shadow-modal: 0 8px 40px rgba(0,0,0,0.12);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
        html { scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }
        body {
            background:var(--bg-primary);
            color:var(--text-primary);
            font-family:var(--font-sans);
            line-height:1.5;
            min-height:100vh;
            overflow-x:hidden;
            transition:background var(--transition-smooth), color var(--transition-smooth);
        }
        body.modal-open { overflow:hidden; }
        a { color:var(--accent); text-decoration:none; }
        a:hover { text-decoration:underline; }
        button { cursor:pointer; font-family:inherit; }
        input,select { font-family:inherit; }
        img { max-width:100%; display:block; }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background:var(--border-accent); border-radius:3px; }

        /* ============================================================
           HEADER BAR
           ============================================================ */
        .app-header {
            position:sticky; top:0; z-index:100;
            background:var(--bg-header);
            border-bottom:1px solid var(--border-subtle);
            height:var(--header-h);
            display:flex; align-items:center; justify-content:space-between;
            padding:0 var(--space-lg);
            backdrop-filter:blur(14px);
            -webkit-backdrop-filter:blur(14px);
            transition:background var(--transition-smooth), border var(--transition-smooth);
        }
        .header-left { display:flex; align-items:baseline; gap:12px; }
        .logo {
            font-size:1.2rem; font-weight:800; letter-spacing:-0.02em;
            background:var(--accent-gradient);
            -webkit-background-clip:text; background-clip:text;
            color:transparent; white-space:nowrap;
        }
        .slogan {
            font-size:0.7rem; color:var(--text-slogan);
            white-space:nowrap; display:block;
            transition:color var(--transition-smooth);
        }
        .header-right { display:flex; align-items:center; gap:var(--space-sm); }

        /* Theme toggle */
        .theme-toggle, .resp-toggle {
            width:36px; height:36px; border-radius:50%;
            border:1px solid var(--border-subtle);
            background:var(--bg-toolbar); color:var(--text-secondary);
            font-size:1.05rem;
            display:flex; align-items:center; justify-content:center;
            transition:var(--transition-fast);
            flex-shrink:0;
        }
        .theme-toggle:hover, .resp-toggle:hover {
            border-color:var(--border-medium); color:var(--text-primary);
        }
        .resp-toggle.active {
            background:var(--bg-toolbar-btn-active);
            border-color:var(--bg-toolbar-btn-active);
            color:var(--bg-toolbar-btn-active-text);
        }

        /* ============================================================
           TOOLBAR
           ============================================================ */
        .toolbar {
            background:var(--bg-toolbar);
            border-bottom:1px solid var(--border-subtle);
            height:var(--toolbar-h);
            display:flex; align-items:center; justify-content:space-between;
            padding:0 var(--space-lg);
            gap:var(--space-sm);
            transition:background var(--transition-smooth), border var(--transition-smooth);
            position:sticky; top:var(--header-h); z-index:90;
        }
        .toolbar-left { display:flex; align-items:center; gap:var(--space-sm); flex:0 0 auto; }
        .toolbar-center { display:flex; align-items:center; justify-content:center; flex:1 1 auto; }
        .toolbar-right { display:flex; align-items:center; gap:var(--space-sm); flex:0 0 auto; }

        /* Pill button style */
        .pill-btn {
            display:inline-flex; align-items:center; gap:4px;
            padding:5px 14px; border-radius:var(--radius-full);
            border:1px solid var(--border-subtle);
            background:var(--bg-toolbar-btn); color:var(--text-secondary);
            font-size:0.78rem; font-weight:500;
            transition:var(--transition-fast);
            white-space:nowrap; height:30px;
        }
        .pill-btn:hover { border-color:var(--border-medium); color:var(--text-primary); }
        .pill-btn .icon { font-size:0.9rem; line-height:1; }

        /* Pill toggle group */
        .pill-toggle {
            display:flex; border-radius:var(--radius-full);
            border:1px solid var(--border-subtle);
            overflow:hidden; height:30px;
        }
        .pill-toggle .pill-btn {
            border:none; border-radius:0;
            background:transparent;
        }
        .pill-toggle .pill-btn:first-child { border-radius:var(--radius-full) 0 0 var(--radius-full); }
        .pill-toggle .pill-btn:last-child { border-radius:0 var(--radius-full) var(--radius-full) 0; }
        .pill-toggle .pill-btn.active {
            background:var(--bg-toolbar-btn-active);
            color:var(--bg-toolbar-btn-active-text);
            border-color:var(--bg-toolbar-btn-active);
        }
        /* Smaller pills inside toggle */
        .pill-toggle .pill-btn.sub-pill {
            padding:5px 10px;
            font-size:0.75rem;
        }

        /* ============================================================
           MAIN LAYOUT
           ============================================================ */
        .app-layout {
            display:flex;
            min-height:calc(100vh - var(--header-h) - var(--toolbar-h));
        }
        body.phone-mode .app-layout {
            max-width:480px; margin:0 auto;
        }
        .content-area {
            flex:1; padding:var(--space-lg);
            display:flex; flex-direction:column;
            gap:var(--space-md);
            min-width:0;
        }

        /* ============================================================
           FILTER SIDEBAR — desktop fixed sidebar
           ============================================================ */
        .filter-sidebar {
            width:var(--filter-width); min-width:320px;
            background:var(--bg-secondary);
            border-right:1px solid var(--border-subtle);
            padding:var(--space-lg);
            overflow-y:auto;
            max-height:calc(100vh - var(--header-h) - var(--toolbar-h));
            position:sticky; top:calc(var(--header-h) + var(--toolbar-h));
            display:flex; flex-direction:column; gap:var(--space-md);
            transition:background var(--transition-smooth), border var(--transition-smooth);
        }
        .filter-sidebar-header { display:none; }
        .filter-overlay { display:none; }

        /* Narrow/phone: sidebar slides in as drawer */
        @media (max-width:1023px) {
            .filter-sidebar {
                position:fixed; top:0; left:0; bottom:0; z-index:85;
                width:var(--filter-width); max-width:85vw;
                transform:translateX(-100%);
                margin-top:0 !important;
                max-height:100vh;
                transition:transform 0.3s ease, background var(--transition-smooth), border var(--transition-smooth);
            }
            .filter-sidebar.open { transform:translateX(0); }
            .filter-sidebar-header {
                display:flex; align-items:center; justify-content:space-between;
                margin-bottom:var(--space-md);
                flex-shrink:0;
            }
            .filter-sidebar-header h3 { font-size:0.95rem; font-weight:700; }
            .filter-sidebar-close {
                width:30px; height:30px; border-radius:50%;
                border:none; background:var(--bg-toolbar); color:var(--text-secondary);
                font-size:1rem;
                display:flex; align-items:center; justify-content:center;
                cursor:pointer;
            }
            .filter-sidebar-close:hover { color:var(--text-primary); }
            .filter-overlay {
                display:none; position:fixed; inset:0; top:0; z-index:80;
                background:rgba(0,0,0,0.4);
            }
            .filter-overlay.open { display:block; }
        }

        /* Phone-mode simulation (📱 toggle on wide screens): same as narrow */
        body.phone-mode .filter-sidebar {
            position:fixed; top:0; left:0; bottom:0; z-index:85;
            width:var(--filter-width); max-width:85vw;
            transform:translateX(-100%);
            margin-top:0 !important;
            max-height:100vh;
            transition:transform 0.3s ease, background var(--transition-smooth), border var(--transition-smooth);
        }
        body.phone-mode .filter-sidebar.open { transform:translateX(0); }
        body.phone-mode .filter-sidebar-header { display:flex; }
        body.phone-mode .filter-overlay {
            display:none; position:fixed; inset:0; top:0; z-index:80;
            background:rgba(0,0,0,0.4);
        }
        body.phone-mode .filter-overlay.open { display:block; }

        .filter-section { display:flex; flex-direction:column; gap:var(--space-xs); }
        .filter-label {
            font-size:0.75rem; font-weight:600; text-transform:uppercase;
            letter-spacing:0.05em; color:var(--text-muted);
            transition:color var(--transition-smooth);
        }
        .filter-select, .filter-input {
            width:100%; padding:8px 12px; border-radius:var(--radius-sm);
            border:1px solid var(--border-subtle);
            background:var(--bg-input); color:var(--text-primary);
            font-size:0.85rem; transition:var(--transition-fast);
        }
        .filter-select:focus, .filter-input:focus {
            outline:none; border-color:var(--accent);
            box-shadow:0 0 0 3px var(--accent-glow);
        }
        .filter-select { cursor:pointer; }

        .filter-row { display:flex; gap:var(--space-sm); align-items: center; width: 100%; }
        .filter-row .filter-input { flex:1; }
        .filter-row-inline { display:flex; flex-direction:row; align-items:center; gap:var(--space-sm); }
        .filter-row-inline .filter-label { white-space:nowrap; flex-shrink:0; }
        .filter-row-inline .filter-input { flex:1; min-width:0; }

        .genre-chips { display:flex; flex-wrap:wrap; gap:6px; max-height:200px; overflow-y:auto; padding:2px 0; }
        .genre-chip {
            padding:5px 12px; border-radius:var(--radius-full);
            border:1px solid var(--border-subtle);
            background:var(--bg-chip); color:var(--text-secondary);
            font-size:0.75rem; font-weight:500; cursor:pointer;
            transition:var(--transition-fast);
            white-space:nowrap;
        }
        .genre-chip:hover { border-color:var(--border-medium); color:var(--text-primary); }
        .genre-chip.active {
            background:var(--bg-chip-active); border-color:var(--accent);
            color:var(--accent);
        }

        .provider-chips { display:flex; flex-wrap:wrap; gap:6px; }
        .provider-chip {
            padding:5px 10px; border-radius:var(--radius-full);
            border:1px solid var(--border-subtle);
            background:var(--bg-chip); color:var(--text-secondary);
            font-size:0.7rem; font-weight:500; cursor:pointer;
            transition:var(--transition-fast);
        }
        .provider-chip:hover { border-color:var(--border-medium); }
        .provider-chip.active {
            background:var(--bg-chip-active); border-color:var(--accent);
            color:var(--accent);
        }

        .btn-primary {
            width:100%; padding:10px; border-radius:var(--radius-md); border:none;
            background:var(--accent); color:#fff;
            font-size:0.85rem; font-weight:600;
            transition:var(--transition-fast);
        }
        .btn-primary:hover { background:var(--accent-hover); box-shadow:0 4px 12px var(--accent-glow); }
        .btn-secondary {
            width:100%; padding:10px; border-radius:var(--radius-md);
            border:1px solid var(--border-subtle);
            background:transparent; color:var(--text-secondary);
            font-size:0.85rem; font-weight:500;
            transition:var(--transition-fast);
        }
        .btn-secondary:hover { border-color:var(--border-medium); color:var(--text-primary); }

        /* ============================================================
           CONTENT AREA — RESULTS
           ============================================================ */
        .results-header {
            display:flex; align-items:center; justify-content:space-between;
            flex-wrap:wrap; gap:var(--space-sm);
        }
        .results-count { font-size:0.9rem; color:var(--text-secondary); transition:color var(--transition-smooth); }
        .results-count strong { color:var(--text-primary); }
        .active-filters {
            display:flex; flex-wrap:wrap; gap:6px; align-items:center;
        }
        .filter-tag {
            display:inline-flex; align-items:center; gap:4px;
            padding:3px 10px; border-radius:var(--radius-full);
            background:var(--bg-chip-active); color:var(--accent);
            font-size:0.7rem; font-weight:500;
            transition:background var(--transition-smooth), color var(--transition-smooth);
        }
        .filter-tag-remove {
            cursor:pointer; opacity:0.7; font-size:0.85rem; line-height:1;
        }
        .filter-tag-remove:hover { opacity:1; }

        /* ============================================================
           LIST VIEW
           ============================================================ */
        .card-list { display:flex; flex-direction:column; gap:var(--space-sm); }
        .card-list-item {
            display:flex; gap:var(--space-md);
            background:var(--bg-card); border:1px solid var(--border-subtle);
            border-radius:var(--radius-lg); padding:var(--space-md);
            cursor:pointer; transition:var(--transition-smooth);
            contain:content;
            box-shadow:var(--shadow-card);
        }
        .card-list-item:hover {
            background:var(--bg-card-hover);
            border-color:var(--border-medium);
            transform:translateX(4px);
        }
        .card-list-poster {
            width:64px; height:96px; border-radius:var(--radius-sm);
            object-fit:cover; flex-shrink:0; background:var(--bg-tertiary);
        }
        .card-list-poster-placeholder {
            width:64px; height:96px; border-radius:var(--radius-sm);
            flex-shrink:0; background:var(--bg-tertiary);
            display:flex; align-items:center; justify-content:center;
            font-size:1.5rem; color:var(--text-muted);
        }
        .card-list-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; justify-content:center; }
        .card-list-title { font-weight:700; font-size:1rem; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .card-list-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:0.8rem; color:var(--text-secondary); }
        .card-list-meta span { white-space:nowrap; }
        .card-list-rating {
            display:inline-flex; align-items:center; gap:3px;
            background:var(--rating-bg); color:var(--rating-gold);
            padding:2px 8px; border-radius:var(--radius-full);
            font-weight:700; font-size:0.78rem;
        }
        .card-list-genres { display:flex; flex-wrap:wrap; gap:4px; }
        .card-list-genre-tag {
            font-size:0.68rem; padding:1px 8px; border-radius:var(--radius-full);
            border:1px solid var(--border-subtle); color:var(--text-muted);
            white-space:nowrap;
        }
        .card-list-overview {
            font-size:0.8rem; color:var(--text-muted);
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
            overflow:hidden; line-height:1.4;
        }

        /* ============================================================
           GRID VIEW
           ============================================================ */
        .card-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(175px, 1fr));
            gap:var(--space-md);
        }
        .card-grid-item {
            background:var(--bg-card); border:1px solid var(--border-subtle);
            border-radius:var(--radius-lg); overflow:hidden;
            cursor:pointer; transition:var(--transition-smooth);
            contain:content; box-shadow:var(--shadow-card);
        }
        .card-grid-item:hover {
            transform:translateY(-4px);
            border-color:var(--border-medium);
            box-shadow:0 8px 24px rgba(0,0,0,0.25);
        }
        .card-grid-poster-wrap { position:relative; aspect-ratio:2/3; overflow:hidden; background:var(--bg-tertiary); }
        .card-grid-poster { width:100%; height:100%; object-fit:cover; transition:transform 0.3s ease; }
        .card-grid-item:hover .card-grid-poster { transform:scale(1.05); }
        .card-grid-rating {
            position:absolute; top:8px; right:8px;
            background:rgba(0,0,0,0.75); color:var(--rating-gold);
            padding:3px 8px; border-radius:var(--radius-full);
            font-size:0.72rem; font-weight:700;
            backdrop-filter:blur(4px);
        }
        .card-grid-info { padding:10px 12px 12px; }
        .card-grid-title {
            font-weight:600; font-size:0.85rem; color:var(--text-primary);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .card-grid-year { font-size:0.72rem; color:var(--text-muted); margin-top:2px; }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display:flex; align-items:center; justify-content:center; gap:var(--space-xs);
            padding:var(--space-md) 0;
        }
        .page-btn {
            min-width:36px; height:36px; border-radius:var(--radius-sm);
            border:1px solid var(--border-subtle);
            background:var(--bg-card); color:var(--text-secondary);
            font-size:0.85rem; font-weight:500;
            display:flex; align-items:center; justify-content:center;
            transition:var(--transition-fast); padding:0 10px;
        }
        .page-btn:hover:not(:disabled):not(.active) {
            border-color:var(--border-medium); color:var(--text-primary);
        }
        .page-btn.active {
            background:var(--accent); border-color:var(--accent); color:#fff;
            box-shadow:0 2px 8px var(--accent-glow);
        }
        .page-btn:disabled { opacity:0.35; cursor:default; }
        .page-ellipsis { color:var(--text-muted); padding:0 4px; }

        /* ============================================================
           DETAIL MODAL
           ============================================================ */
        .modal-overlay {
            position:fixed; inset:0; z-index:200;
            background:rgba(0,0,0,0.8); backdrop-filter:blur(8px);
            display:none; align-items:center; justify-content:center;
            padding:var(--space-lg);
        }
        .modal-overlay.open { display:flex; }
        .modal-content {
            background:var(--bg-modal); border:1px solid var(--border-medium);
            border-radius:var(--radius-xl); max-width:800px; width:100%;
            max-height:90vh; overflow-y:auto; position:relative;
            animation:modalIn 0.3s ease; box-shadow:var(--shadow-modal);
        }
        @keyframes modalIn {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        .modal-close {
            position:sticky; top:12px; float:right; z-index:10;
            width:36px; height:36px; border-radius:50%;
            border:none; background:rgba(0,0,0,0.6);
            color:#fff; font-size:1.2rem;
            display:flex; align-items:center; justify-content:center;
            margin-right:12px;
        }
        .modal-close:hover { background:rgba(255,255,255,0.15); }
        .modal-backdrop-wrap {
            position:relative; width:100%; height:250px; overflow:hidden;
            border-radius:var(--radius-xl) var(--radius-xl) 0 0;
        }

    function escapeHtml(str) {
        if (!str && str !== 0) return '';
        const map = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#x27;' };
        return String(str).replace(/[&<>"']/g, m => map[m]);

    async function apiFetch(endpoint, params = {}) {
        //const url = new URL('/tmdb/3' + endpoint, window.location.origin);
        const url = new URL('https://api.themoviedb.org/3' + endpoint, window.location.origin);
        
        Object.entries(params).forEach(([k, v]) => {
            if (v === '' || v === null || v === undefined) return;
            if (Array.isArray(v) && v.length === 0) return;
            url.searchParams.set(k, Array.isArray(v) ? v.join(',') : v);
        });
        url.searchParams.set('language', 'zh-CN');

        const res = await fetch(url.toString(), {
            headers: {
                'Authorization': 'Bearer ' + TMDB_TOKEN,
                'Content-Type': 'application/json',
            },
            signal: AppState.abortController ? AppState.abortController.signal : undefined,
        });

        if (!res.ok) {
            const errText = await res.text().catch(() => 'Unknown error');
            const err = new Error('HTTP ' + res.status + ': ' + errText.substring(0, 200));
            err.status = res.status;
            throw err;
        }
        return res.json();
    }

    async function fetchGenres(type) {
        const cacheKey = 'tmdb_genres_' + type;
        try {
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) {
                const parsed = JSON.parse(cached);
                if (parsed.length > 0) return parsed;
            }
        } catch (_) {}

        const data = await apiFetch('/genre/' + type + '/list');
        const genres = data.genres || [];
        try { sessionStorage.setItem(cacheKey, JSON.stringify(genres)); } catch (_) {}
        return genres;
    }

    async function fetchDiscover() {
        const params = { sort_by:AppState.sortBy, page:AppState.currentPage };

        if (AppState.withGenres.length > 0) params.with_genres = AppState.withGenres;
        if (AppState.voteAverageGte > 0) params['vote_average.gte'] = AppState.voteAverageGte;
        if (AppState.voteAverageLte < 10) params['vote_average.lte'] = AppState.voteAverageLte;
        if (AppState.voteCountGte > 0) params['vote_count.gte'] = AppState.voteCountGte;
        if (AppState.year) {
            params[AppState.mediaType === 'movie' ? 'primary_release_year' : 'first_air_date_year'] = AppState.year;
        }
        if (AppState.dateGte) {
            params[AppState.mediaType === 'movie' ? 'primary_release_date.gte' : 'first_air_date.gte'] = AppState.dateGte;
        }
        if (AppState.dateLte) {
            params[AppState.mediaType === 'movie' ? 'primary_release_date.lte' : 'first_air_date.lte'] = AppState.dateLte;
        }
        if (AppState.withOriginalLanguage) params.with_original_language = AppState.withOriginalLanguage;
        if (AppState.region) params.region = AppState.region;
        if (AppState.watchProviders.length > 0 && AppState.watchRegion) {
            params.with_watch_providers = AppState.watchProviders;
            params.watch_region = AppState.watchRegion;
        }

        return apiFetch('/discover/' + AppState.mediaType, params);
    }

    async function fetchSearch() {
        const params = { query:AppState.searchQuery, page:AppState.currentPage };
        if (AppState.year) params.year = AppState.year;
        if (AppState.region) params.region = AppState.region;
        return apiFetch('/search/' + AppState.mediaType, params);
    }

    async function fetchDetail(id) {
        const append = 'credits,recommendations,watch/providers';
        return apiFetch('/' + AppState.mediaType + '/' + id, { append_to_response:append });
    }

    function renderPagination() {
        const container = $('pagination');
        if (AppState.totalPages <= 1) {
            container.innerHTML = '';
            return;
        }
        const current = AppState.currentPage;
        const total = AppState.totalPages;
        let pages = [];

        pages.push(1);
        for (let i = Math.max(2, current - 2); i <= Math.min(total - 1, current + 2); i++) {
            if (i === pages[pages.length - 1] + 1) pages.push(i);
            else if (i > pages[pages.length - 1] + 1) { pages.push('...'); pages.push(i); }
        }
        if (total > 1 && pages[pages.length - 1] !== total) {
            if (pages[pages.length - 1] !== total - 1) pages.push('...');
            pages.push(total);
        }

        container.innerHTML =
            '<button class="page-btn" ' + (current === 1 ? 'disabled' : '') + ' data-page="' + (current - 1) + '">◀</button>' +
            pages.map(p => {
                if (p === '...') return '<span class="page-ellipsis">...</span>';
                return '<button class="page-btn' + (p === current ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
            }).join('') +
            '<button class="page-btn" ' + (current === total ? 'disabled' : '') + ' data-page="' + (current + 1) + '">▶</button>';

        container.querySelectorAll('.page-btn:not([disabled])').forEach(btn => {
            btn.addEventListener('click', () => {
                const page = parseInt(btn.dataset.page);
                if (page && page !== AppState.currentPage && page >= 1 && page <= AppState.totalPages) {
                    AppState.currentPage = page;
                    loadData();
                    document.querySelector('.content-area').scrollIntoView({ behavior:'smooth' });
                }
            });
        });
    }

        $('modalBody').innerHTML =
            '<div class="state-message" style="min-height:200px;">' +

                '<div class="state-message" style="min-height:200px;">' +
                    '<div class="state-icon">⚠️</div>' +

    function renderDetailModal() {
        const d = AppState.detailData;
        const title = d.title || d.name || 'Untitled';
        const dateStr = d.release_date || d.first_air_date || '';
        const year = dateStr ? dateStr.slice(0, 4) : '';

        const tagline = d.tagline || '';
        const overview = d.overview || '暂无简介';
        const rating = d.vote_average != null ? d.vote_average.toFixed(1) : '?';
        const voteCount = d.vote_count || 0;
        const genres = (d.genres || []).map(g => g.name);
        const countries = (d.production_countries || []).map(c => c.name).join(', ') || '—';
        const tmdbUrl = 'https://www.themoviedb.org/' + AppState.mediaType + '/' + d.id;
        const status = d.status || '';
        const seasons = d.number_of_seasons ? d.number_of_seasons + ' 季' : '';

        const crew = d.credits || {};

        let castHtml = '';

                        (tagline ? '<p class="modal-tagline">"' + escapeHtml(tagline) + '"</p>' : '') +

            '</div>';

        // Wire up recommendation clicks
        $('modalBody').querySelectorAll('.rec-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                openDetail(parseInt(card.dataset.id));
            });
        });
    }

    function closeDetail() {
        $('detailModal').classList.remove('open');
        $('detailModal').setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
        AppState.detailData = null;
    }

    /* ============================================================
       SECTION 7: DATA LOADING
       ============================================================ */
    function scheduleFilterFetch() {
        clearTimeout(AppState.filterDebounce);
        AppState.filterDebounce = setTimeout(() => {
            AppState.currentPage = 1;
            loadData();
        }, 300);
    }

    function applyFilters() {
        clearTimeout(AppState.filterDebounce);
        AppState.currentPage = 1;
        loadData();
        // Close drawer on mobile/phone mode
        if (window.innerWidth < 1024 || AppState.respMode === 'phone') {
            $('filterSidebar').classList.remove('open');
            $('filterOverlay').classList.remove('open');
            AppState.filtersOpen = false;
        }
    }

    async function loadData() {
        if (AppState.abortController) {
            AppState.abortController.abort();
        }
        AppState.abortController = new AbortController();
        AppState.isLoading = true;
        AppState.error = null;

        renderSkeletons();
        renderResultsHeader();
        renderPagination();
        renderActiveFilters();

        try {
            const data = AppState.searchQuery.trim()
                ? await fetchSearch()
                : await fetchDiscover();

            AppState.results = data.results || [];
            AppState.totalResults = data.total_results || 0;
            AppState.totalPages = Math.min(data.total_pages || 1, 500);

            if (AppState.viewMode === 'grid') renderGridView();
            else renderListView();

            renderResultsHeader();
            renderPagination();
            renderActiveFilters();
        } catch (err) {
            if (err.name === 'AbortError') return;
            AppState.error = err;
            renderError(err);
            renderPagination();
        }
        AppState.isLoading = false;
        AppState.abortController = null;
    }

    function resetFilters() {
        AppState.sortBy = 'popularity.desc';
        AppState.withGenres = [];
        AppState.voteAverageGte = 0;
        AppState.voteAverageLte = 10;
        AppState.voteCountGte = 0;
        AppState.dateGte = '';
        AppState.dateLte = '';
        AppState.year = '';
        AppState.withOriginalLanguage = '';
        AppState.region = '';
        AppState.watchProviders = [];
        AppState.watchRegion = '';
        AppState.searchQuery = '';
        AppState.currentPage = 1;

        $('sortSelect').value = 'popularity.desc';
        $('ratingMin').value = '';
        $('ratingMax').value = '';
        $('voteCountMin').value = '';
        $('dateFrom').value = '';
        $('dateTo').value = '';
        $('yearInput').value = '';
        $('languageSelect').value = '';
        $('regionSelect').value = '';
        $('watchRegionSelect').value = '';
        $('searchInput').value = '';

        renderGenreChips();
        renderProviderChips();
        renderActiveFilters();
    }

    /* ============================================================
       SECTION 8: EVENT HANDLERS
       ============================================================ */
    function setupEvents() {
        // Theme toggle
        $('btnThemeToggle').addEventListener('click', toggleTheme);

        // Responsive mode toggle (phone/desktop simulation)
        $('btnRespToggle').addEventListener('click', toggleRespMode);

        // Window resize — re-check layout visibility
        window.addEventListener('resize', () => {
            if (AppState.respMode !== 'phone') updateLayoutVisibility();
        });

        // Filter drawer open/close
        $('btnFilterOpen').addEventListener('click', () => {
            AppState.filtersOpen = true;
            $('filterSidebar').classList.add('open');
            $('filterOverlay').classList.add('open');
        });
        function closeFilterDrawer() {
            AppState.filtersOpen = false;
            $('filterSidebar').classList.remove('open');
            $('filterOverlay').classList.remove('open');
        }
        $('btnFilterClose').addEventListener('click', closeFilterDrawer);
        $('filterOverlay').addEventListener('click', closeFilterDrawer);

        // Media type toggle (pill-toggle delegation) — immediate fetch
        $('mediaToggle').addEventListener('click', e => {
            const btn = e.target.closest('.pill-btn');
            if (!btn || !btn.dataset.type) return;
            const type = btn.dataset.type;
            if (type === AppState.mediaType) return;
            AppState.mediaType = type;
            AppState.currentPage = 1;
            AppState.withGenres = [];
            AppState.sortBy = 'popularity.desc';
            $('mediaToggle').querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateDateLabel();
            renderSortOptions();
            renderGenreChips();
            renderActiveFilters();
            loadData();
        });

        // View mode toggle — no fetch, just switch rendered view
        $('viewToggle').addEventListener('click', e => {
            const btn = e.target.closest('.pill-btn');
            if (!btn || !btn.dataset.view) return;
            const view = btn.dataset.view;
            if (view === AppState.viewMode) return;
            AppState.viewMode = view;
            $('viewToggle').querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (AppState.results.length) {
                if (view === 'grid') renderGridView();
                else renderListView();
            } else if (AppState.isLoading) {
                renderSkeletons();
            }
        });

        // Apply button — triggers fetch with current filter settings
        $('btnApply').addEventListener('click', applyFilters);

        // Sort change — save but don't fetch
        $('sortSelect').addEventListener('change', () => {
            AppState.sortBy = $('sortSelect').value;
        });

        // Search input — save but don't fetch (user must click apply)
        $('searchInput').addEventListener('input', () => {
            clearTimeout(AppState.searchDebounce);
            AppState.searchDebounce = setTimeout(() => {
                AppState.searchQuery = $('searchInput').value.trim();
            }, 400);
        });

        // Filter inputs — save to state but don't auto-fetch
        $('ratingMin').addEventListener('change', () => {
            const v = parseFloat($('ratingMin').value);
            AppState.voteAverageGte = isNaN(v) ? 0 : Math.max(0, Math.min(10, v));
        });
        $('ratingMax').addEventListener('change', () => {
            const v = parseFloat($('ratingMax').value);
            AppState.voteAverageLte = isNaN(v) ? 10 : Math.max(0, Math.min(10, v));
        });
        $('voteCountMin').addEventListener('change', () => {
            const v = parseInt($('voteCountMin').value);
            AppState.voteCountGte = isNaN(v) ? 0 : Math.max(0, v);
        });
        $('dateFrom').addEventListener('change', () => {
            AppState.dateGte = $('dateFrom').value;
        });
        $('dateTo').addEventListener('change', () => {
            AppState.dateLte = $('dateTo').value;
        });
        $('yearInput').addEventListener('change', () => {
            AppState.year = $('yearInput').value.trim();
        });
        $('languageSelect').addEventListener('change', () => {
            AppState.withOriginalLanguage = $('languageSelect').value;
        });
        $('regionSelect').addEventListener('change', () => {
            AppState.region = $('regionSelect').value;
        });
        $('watchRegionSelect').addEventListener('change', () => {
            AppState.watchRegion = $('watchRegionSelect').value;
            AppState.watchProviders = [];
            renderProviderChips();
        });

        // Reset button — immediate, doesn't need apply
        $('btnReset').addEventListener('click', () => {
            resetFilters();
            applyFilters();
        });

        // Modal close
        $('modalClose').addEventListener('click', closeDetail);
        $('detailModal').addEventListener('click', e => {
            if (e.target === $('detailModal')) closeDetail();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if ($('detailModal').classList.contains('open')) closeDetail();
                else if ($('filterSidebar').classList.contains('open')) closeFilterDrawer();
            }
        });
    }

    function updateDateLabel() {
        $('dateLabel').textContent = AppState.mediaType === 'movie' ? '📅 上映日期范围' : '📅 首播日期范围';
    }

    /* ============================================================
       SECTION 9: INITIALIZATION
       ============================================================ */
    async function init() {
        initTheme();
        setupEvents();

        // Render static filter options
        renderLanguageOptions();
        renderRegionOptions();
        renderWatchRegionOptions();
        renderSortOptions();
        updateDateLabel();

        // Fetch genres (cached)
        try {
            const genres = await fetchGenres('movie');
            AppState.genres.movie = genres;
            const map = new Map();
            genres.forEach(g => map.set(g.id, g.name));
            AppState.genreMap.movie = map;
        } catch (_) {
            AppState.genres.movie = [];
        }
        try {
            const tvGenres = await fetchGenres('tv');
            AppState.genres.tv = tvGenres;
            const map = new Map();
            tvGenres.forEach(g => map.set(g.id, g.name));
            AppState.genreMap.tv = map;
        } catch (_) {
            AppState.genres.tv = [];
        }

        renderGenreChips();
        renderProviderChips();

        // Load initial data
        loadData();
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
